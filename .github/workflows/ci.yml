name: Build & Release Multi-Distro Linux Binaries

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish release to GitHub automatically?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. TEST MATRIX ACROSS MULTIPLE LINUX DISTRIBUTIONS
  # =========================================================================
  test-distros:
    name: Test build on ${{ matrix.distro.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: Ubuntu 24.04 (Noble)
            image: ubuntu:24.04
            setup: apt-get update && apt-get install -y curl build-essential pkg-config libasound2-dev libfontconfig1-dev libpipewire-0.3-dev libspa-0.2-dev clang libclang-dev
          - name: Fedora 40
            image: fedora:40
            setup: dnf install -y curl gcc pkg-config alsa-lib-devel fontconfig-devel pipewire-devel clang clang-devel
          - name: Arch Linux
            image: archlinux:latest
            setup: pacman -Syu --noconfirm base-devel curl alsa-lib fontconfig pipewire clang pkgconf
    container:
      image: ${{ matrix.distro.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: ${{ matrix.distro.setup }}

      - name: Install Rust Toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.distro.name }}

      - name: Run test suite (All Features)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --all-features

      - name: Build release binary
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --features "gui,pipewire-backend"

      - name: Verify CLI help execution
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ./target/release/shizune --help

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: shizune-${{ matrix.distro.name }}
          path: target/release/shizune

  # =========================================================================
  # 2. STANDALONE APPIMAGE BUNDLE
  # =========================================================================
  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libpipewire-0.3-dev libspa-0.2-dev clang libclang-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: appimage

      - name: Build Release Binary
        run: cargo build --release --features "gui,pipewire-backend"

      - name: Package AppDir
        run: ./scripts/build-appimage.sh

      - name: Download appimagetool
        run: |
          curl -sLO https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          mv squashfs-root appimagetool.AppDir

      - name: Generate AppImage
        run: |
          ARCH=x86_64 ./appimagetool.AppDir/AppRun AppDir Shizune-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Shizune-x86_64.AppImage
          path: Shizune-x86_64.AppImage
