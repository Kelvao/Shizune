name: CI & Distribution Builds

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  matrix-builds:
    name: Build on ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: "Ubuntu 24.04 (Noble)"
            container: "ubuntu:24.04"
            setup_cmd: "apt-get update && apt-get install -y curl build-essential pkg-config libasound2-dev libfontconfig1-dev libpipewire-0.3-dev libspa-0.2-dev clang libclang-dev"
          - distro: "Fedora 40"
            container: "fedora:40"
            setup_cmd: "dnf install -y curl gcc pkg-config alsa-lib-devel fontconfig-devel pipewire-devel clang clang-devel"
          - distro: "Arch Linux"
            container: "archlinux:latest"
            setup_cmd: "pacman -Syu --noconfirm base-devel curl alsa-lib fontconfig pipewire clang pkgconf"

    container:
      image: ${{ matrix.container }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: ${{ matrix.setup_cmd }}

      - name: Install Rust Toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.distro }}

      - name: Build & Test (All Features)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --all-features
          cargo build --release --features "gui,pipewire-backend"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shizune-${{ matrix.distro }}
          path: target/release/shizune

  appimage:
    name: Build AppImage
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libpipewire-0.3-dev libspa-0.2-dev clang libclang-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: appimage

      - name: Build Release Binary
        run: cargo build --release --features "gui,pipewire-backend"

      - name: Package AppDir
        run: ./scripts/build-appimage.sh

      - name: Download appimagetool
        run: |
          curl -sLO https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          mv squashfs-root appimagetool.AppDir

      - name: Generate AppImage
        run: |
          ARCH=x86_64 ./appimagetool.AppDir/AppRun AppDir Shizune-x86_64.AppImage

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shizune-x86_64.AppImage
          path: Shizune-x86_64.AppImage
