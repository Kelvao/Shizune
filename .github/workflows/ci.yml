name: Build & Release Multi-Distro Linux Binaries

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish release to GitHub automatically?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. TEST MATRIX ACROSS MULTIPLE LINUX DISTRIBUTIONS
  # =========================================================================
  test-distros:
    name: Test build on ${{ matrix.distro.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: Ubuntu Latest
            image: ubuntu:latest
            setup: apt-get update && apt-get install -y curl build-essential pkg-config libasound2-dev libfontconfig1-dev clang libclang-dev
          - name: Debian Stable
            image: debian:stable-slim
            setup: apt-get update && apt-get install -y curl build-essential pkg-config libasound2-dev libfontconfig1-dev clang libclang-dev
          - name: Fedora Latest
            image: fedora:latest
            setup: dnf install -y curl gcc pkg-config alsa-lib-devel fontconfig-devel clang clang-devel
          - name: Arch Linux
            image: archlinux:latest
            setup: pacman -Syu --noconfirm base-devel curl alsa-lib fontconfig clang pkgconf
    container:
      image: ${{ matrix.distro.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: ${{ matrix.distro.setup }}

      - name: Install Rust Toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Run test suite (All Features)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --all-features

      - name: Build release binary
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --features "gui"

      - name: Verify CLI help execution
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          ./target/release/shizune --help

  # =========================================================================
  # 2. PACKAGE GENERATION (.deb, .rpm, .AppImage, .tar.gz)
  # =========================================================================
  build-packages:
    name: Build Linux Packages (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libasound2-dev libfontconfig1-dev \
            clang libclang-dev rpm file curl zsync libfuse2 appstream

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: packaging-x86_64

      - name: Determine version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Target version: ${VERSION}"

      - name: Create output directory
        run: |
          mkdir -p dist
          chmod +x packaging/*.sh

      - name: Compile release binary (GUI)
        run: cargo build --release --features "gui"

      - name: Generate Portable Tarball (x86_64)
        run: |
          TAR_DIR="shizune-v${{ steps.get_version.outputs.VERSION }}-linux-x86_64"
          mkdir -p "${TAR_DIR}"
          cp target/release/shizune "${TAR_DIR}/"
          cp assets/shizune.desktop "${TAR_DIR}/"
          mkdir -p "${TAR_DIR}/assets"
          cp assets/shizune.svg "${TAR_DIR}/assets/"
          cp README.md "${TAR_DIR}/"
          tar -czvf "dist/${TAR_DIR}.tar.gz" "${TAR_DIR}"
          rm -rf "${TAR_DIR}"

      - name: Build Debian Package (.deb x86_64)
        run: ./packaging/build-deb.sh "${{ steps.get_version.outputs.VERSION }}" "amd64"

      - name: Build RPM Package (.rpm x86_64)
        run: ./packaging/build-rpm.sh "${{ steps.get_version.outputs.VERSION }}" "x86_64"

      - name: Build Universal AppImage (x86_64)
        run: ./packaging/build-appimage.sh "${{ steps.get_version.outputs.VERSION }}" "x86_64"

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: shizune-packages
          path: dist/*
          if-no-files-found: error

  # =========================================================================
  # 3. PUBLISH RELEASE TO GITHUB
  # =========================================================================
  publish-release:
    name: Publish Release to GitHub
    needs: [test-distros, build-packages]
    if: >
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download generated artifacts
        uses: actions/download-artifact@v8
        with:
          name: shizune-packages
          path: dist

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

